<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PptxGenJS Demo - Pure JS</title>
  <!-- Load Bootstrap for styling -->
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    crossorigin="anonymous"
  >
  <!-- Load PptxGenJS with onload event -->
  <script src="https://unpkg.com/pptxgenjs@latest/dist/pptxgen.min.js" onload="onPptxGenJSLoaded()"></script>

  <style>
    body {
      background: var(--light);
    }
  </style>
</head>

<body>
  <div class="container py-3">
    <h1 class="text-primary font-weight-light">PptxGenJS Demo</h1>
    <h5 class="text-secondary font-weight-light">Generate PowerPoint from JavaScript</h5>
    <h6 class="bg-white border p-3 my-5">
      <p>Generate a "Hello World" presentation on any modern desktop or mobile browser.</p>
      <button type="button" class="btn btn-primary px-5" onclick="doDemo()">
        Generate Demo PowerPoint
      </button>
    </h6>

    <div id="versionContainer"></div>

    <div class="mt-5">
      <small>
        GitHub Home
        <a class="pl-1" href="https://github.com/gitbrent/PptxGenJS/" target="_blank">PptxGenJS</a>
      </small>
    </div>
  </div>

  <script>
    // Function that runs after PptxGenJS is loaded
    function onPptxGenJSLoaded() {
      const pptx = new PptxGenJS();
      const versionCode = document.createElement('code');
      versionCode.className = 'd-block text-black-50 mb-3';
      versionCode.textContent = `(pptxgenjs version: ${pptx.version})`;

      const versionContainer = document.getElementById('versionContainer');
      versionContainer.appendChild(versionCode);
    }

    // Function to create a simple slide
    function doDemo() {
      try {
        // Check if PptxGenJS is available before proceeding
        if (typeof PptxGenJS === 'undefined') {
          alert("Error: PptxGenJS is not available. Cannot generate PowerPoint.");
          return;
        }

        // Alert to confirm button click works
        alert("Generating PowerPoint...");

        // Create the PowerPoint file
        let pptx = new PptxGenJS();
        let slide = pptx.addSlide();
        let opts = {
          x: 0.0,
          y: 0.25,
          w: '100%',
          h: 1.5,
          align: 'center',
          fontSize: 24,
          color: '0088CC',
          fill: 'F1F1F1'
        };
        slide.addText(
          'BONJOUR - CIAO - GUTEN TAG - HELLO - HOLA - NAMASTE - OLÀ - ZDRAS-TVUY-TE - こんにちは - 你好',
          opts
        );

        // Save the file
        pptx.writeFile().then(() => {
          alert("PowerPoint file generated and saved!");
        }).catch(err => {
          alert("Error generating PowerPoint: " + err);
        });

      } catch (err) {
        // Catch any unexpected errors
        alert("An error occurred: " + err.message);
      }
    }
  </script>
</body>
</html>
